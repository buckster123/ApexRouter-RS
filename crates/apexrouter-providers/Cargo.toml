[package]
name = "apexrouter-providers"
description = "ApexRouter-RS provisioners — local llama.cpp/vLLM supervisor, vast.ai, together.ai, HuggingFace, ssh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
apexrouter-protocol = { workspace = true }
apexrouter-core     = { workspace = true }
reqwest      = { workspace = true }
tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
async-trait  = { workspace = true }
futures-util = { workspace = true }
tracing      = { workspace = true }
thiserror    = { workspace = true }
anyhow       = { workspace = true }
chrono       = { workspace = true }
rustix       = { workspace = true }
glob         = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
tokio    = { workspace = true, features = ["test-util"] }
# The fake `llama-server` / stub upstream, for the probes whose defect is only visible
# against a real HTTP server that answers the way b9199 does.
apexrouter-tests-support = { workspace = true }
