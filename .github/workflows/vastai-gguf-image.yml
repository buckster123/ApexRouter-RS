# Build and push the vastai-gguf serving images to ghcr — the push-button that replaces
# building CUDA images on a 97%-full laptop. Manual trigger only: an image refresh is a
# deliberate act (rented boxes pull these), never a side effect of a docs commit.
#
# ghcr.io/buckster123/vastai-gguf:prebuilt   — fat binary, SM 80/86/89/90/120 (+PTX)
# ghcr.io/buckster123/vastai-gguf:builder    — compiles on the box for the exact arch
# plus a dated tag of each (:prebuilt-YYYYMMDD) so a bad refresh can be rolled back.

name: vastai-gguf image

on:
  workflow_dispatch:
    inputs:
      image:
        description: Which image to build
        type: choice
        options: [both, prebuilt, builder]
        default: both
      llama_ref:
        description: >-
          llama.cpp ref to bake (branch, commit, or pull/N/head — build-number tags
          lie; MTP wants pull/22673/head on the builder's runtime path instead)
        default: master

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CUDA devel base plus a 6-arch fat build does not fit a stock runner disk.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set the dated tag
        id: date
        run: echo "stamp=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push prebuilt
        if: inputs.image == 'both' || inputs.image == 'prebuilt'
        run: |
          docker build -f docker/Dockerfile \
            --build-arg LLAMA_CPP_REF='${{ inputs.llama_ref }}' \
            -t ghcr.io/buckster123/vastai-gguf:prebuilt \
            -t ghcr.io/buckster123/vastai-gguf:prebuilt-${{ steps.date.outputs.stamp }} \
            docker/
          docker push ghcr.io/buckster123/vastai-gguf:prebuilt
          docker push ghcr.io/buckster123/vastai-gguf:prebuilt-${{ steps.date.outputs.stamp }}

      - name: Build and push builder
        if: inputs.image == 'both' || inputs.image == 'builder'
        run: |
          docker build -f docker/Dockerfile.builder \
            -t ghcr.io/buckster123/vastai-gguf:builder \
            -t ghcr.io/buckster123/vastai-gguf:builder-${{ steps.date.outputs.stamp }} \
            docker/
          docker push ghcr.io/buckster123/vastai-gguf:builder
          docker push ghcr.io/buckster123/vastai-gguf:builder-${{ steps.date.outputs.stamp }}
