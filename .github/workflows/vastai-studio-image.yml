# Build and push the multi-service studio image.
# Manual trigger only — a studio image refresh is a deliberate act (boxes pull it).
#
# ghcr.io/buckster123/vastai-studio:cu128
# ghcr.io/buckster123/vastai-studio:cu128-YYYYMMDD   (rollback)
#
# Depends on ghcr.io/buckster123/vastai-gguf:prebuilt for the llama-server binary
# (COPY --from). Build/publish prebuilt first if that tag is stale.

name: vastai-studio image

on:
  workflow_dispatch:
    inputs:
      comfy_ref:
        description: ComfyUI full commit SHA to pin (R3 measured e803f24…)
        default: e803f24ea090de7108772d65957fd6388d3f2085
      gguf_image:
        description: Source image for llama-server COPY
        default: ghcr.io/buckster123/vastai-gguf:prebuilt
      torch_version:
        description: torch version on the cu128 wheel index
        default: "2.7.1"
      custom_nodes:
        description: Optional comma-separated owner/repo@ref list
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set the dated tag
        id: date
        run: echo "stamp=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Pull the prebuilt GGUF image (llama-server source)
        run: docker pull '${{ inputs.gguf_image }}'

      - name: Build and push vastai-studio:cu128
        run: |
          docker build -f docker/studio/Dockerfile \
            --build-arg GGUF_IMAGE='${{ inputs.gguf_image }}' \
            --build-arg COMFYUI_REF='${{ inputs.comfy_ref }}' \
            --build-arg TORCH_VERSION='${{ inputs.torch_version }}' \
            --build-arg CUSTOM_NODES='${{ inputs.custom_nodes }}' \
            -t ghcr.io/buckster123/vastai-studio:cu128 \
            -t ghcr.io/buckster123/vastai-studio:cu128-${{ steps.date.outputs.stamp }} \
            docker/studio/
          docker push ghcr.io/buckster123/vastai-studio:cu128
          docker push ghcr.io/buckster123/vastai-studio:cu128-${{ steps.date.outputs.stamp }}
